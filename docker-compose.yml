services:
  web:
    build: .
    restart: unless-stopped
    init: true  # Recolhe os processos dos trailers quando terminam.
    env_file: .env
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_HTTPS: "1"
    volumes:
      - ./data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
